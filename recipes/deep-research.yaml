name: deep-research
description: |
  Multi-step deep research workflow with verification.
  Uses Perplexity for primary research, then validates key claims.
  Cost: ~10-50k tokens typical depending on depth and verification.
version: "1.0.0"
author: "Amplifier Perplexity Bundle"
tags: ["research", "perplexity", "citations"]

context:
  research_question: ""      # Required: The question to research
  depth: "standard"          # standard | comprehensive | exhaustive
  verify_claims: true        # Whether to verify key claims with independent sources

steps:
  - id: "scope-research"
    agent: "perplexity:research-expert"
    prompt: |
      Analyze this research question and create a research plan:

      **Question:** {{research_question}}
      **Depth:** {{depth}}

      Output:
      1. Restate the question clearly
      2. Identify 2-3 sub-questions to answer
      3. Recommend mode and model based on complexity:
         - research mode (default): Deep multi-step research via Agentic API
         - chat mode with sonar-pro: Faster, comprehensive coverage
         - chat mode with sonar-reasoning: Complex analysis with reasoning chains
      4. Estimate if this justifies the token cost (~10-50k tokens, YES/NO with reasoning)

      Format your response as a structured research plan.
    output: "research_plan"
    timeout: 120

  - id: "primary-research"
    agent: "perplexity:research-expert"
    prompt: |
      Execute the research plan:

      **Original Question:** {{research_question}}
      **Research Plan:** {{research_plan}}

      Use the `perplexity_research` tool with the recommended mode and model.

      Provide comprehensive findings following the response contract:
      - Research Summary (2-3 sentences)
      - Key Findings with inline citations [1], [2], etc.
      - Complete Sources list
      - Confidence Assessment
    output: "primary_findings"
    timeout: 300
    depends_on: ["scope-research"]
    on_error: continue

  - id: "verify-claims"
    agent: "perplexity:research-expert"
    prompt: |
      Verify the top 3 most important claims from this research:

      {{primary_findings}}

      If you have access to a web search tool (such as web_search / web_fetch) or to an agent
      capable of searching the web or other knowledge sources, use it to cross-check these
      claims against free/public sources first. If no such capability is available, proceed
      with the information already in context and note that external verification was skipped.

      For each claim (where possible):
      1. Search for independent corroboration
      2. Note any conflicting information found
      3. Rate confidence: High / Medium / Low

      This verification uses free tools to validate the paid research.
    output: "verification_results"
    timeout: 180
    depends_on: ["primary-research"]
    condition: "{{verify_claims}}"
    on_error: continue

  - id: "synthesize-report"
    agent: "perplexity:research-expert"
    prompt: |
      Create the final research report:

      **Question:** {{research_question}}
      **Primary Research:** {{primary_findings}}
      **Verification:** {{verification_results}}

      (If verification_results is empty or absent, note in the Source Verification section
      that external verification was skipped because verify_claims was set to false.)

      Synthesize into a comprehensive report with:

      ## Executive Summary
      [2-3 sentences answering the research question]

      ## Detailed Findings
      [Structured findings with citations]

      ## Source Verification
      [Summary of verification results, or note that verification was skipped]

      ## Confidence Assessment
      - High confidence findings
      - Moderate confidence findings
      - Gaps or limitations

      ## Sources
      [Complete list of sources used]

      ## Methodology
      - Research approach used
      - Tools employed
      - Approximate token cost incurred
    output: "final_report"
    timeout: 180
    depends_on: ["primary-research", "verify-claims"]
    on_error: continue
