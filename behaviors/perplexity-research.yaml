bundle:
  name: perplexity-research-behavior
  version: 1.0.0
  description: Perplexity deep research capability - agent, tool, and guidance

# The research tool - embedded in this bundle
# Using git URL with subdirectory for proper module resolution
tools:
  - module: tool-perplexity-search
    source: git+https://github.com/colombod/amplifier-bundle-perplexity@main#subdirectory=modules/tool-perplexity-search
    config:
      reasoning_effort: medium     # Balance speed vs depth
      max_steps: 5                 # Default max research steps
      timeout: 120.0               # Request timeout in seconds

agents:
  include:
    - perplexity:research-expert

context:
  include:
    - perplexity:context/research-awareness.md

hooks:
  - module: hooks-perplexity-nudge
    source: git+https://github.com/colombod/amplifier-bundle-perplexity@main#subdirectory=modules/hooks-perplexity-nudge
    config:
      enabled: true
      cooldown_turns: 6
      max_injections: 3
      scan_depth: 6
      loop_threshold: 3
      error_repeat_threshold: 2
